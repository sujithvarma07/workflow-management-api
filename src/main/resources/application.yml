spring:
  application:
    name: workflow-management-api
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:workflowdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  external-api:
    # Points at a local stub by default for dev - there is no real
    # notification service to call in this environment. See
    # docs/reliability-report.md for how this is meant to be exercised.
    base-url: ${EXTERNAL_API_BASE_URL:http://localhost:9090}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

app:
  external-api:
    # No default - a production deployment must point this at a real
    # endpoint explicitly rather than silently falling back to localhost.
    base-url: ${EXTERNAL_API_BASE_URL}

---
server:
  port: ${SERVER_PORT:8080}

app:
  security:
    # No default - a missing JWT_SECRET fails startup instead of signing
    # tokens with a weak, guessable key. Must be at least 32 bytes
    # (256 bits) for HS256; JwtService enforces this at startup.
    jwt-secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
    # The one ADMIN account created automatically on first startup (see
    # AdminBootstrapSeeder) - also required, also no default, for the same
    # reason: no credential of any kind is committed to this repository.
    admin-bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME}
    admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL}
    admin-bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  external-api:
    connect-timeout-ms: ${EXTERNAL_API_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${EXTERNAL_API_RESPONSE_TIMEOUT_MS:5000}
  batch:
    chunk-size: ${BULK_IMPORT_CHUNK_SIZE:50}

resilience4j:
  circuitbreaker:
    instances:
      externalNotification:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # How long the breaker stays OPEN (rejecting calls immediately via
        # CallNotPermittedException) before it lets one trial call through
        # to see if the dependency has recovered.
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: true
    redis:
      enabled: true

logging:
  level:
    root: INFO
    com.relic.backend: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [correlationId=%X{correlationId:-n/a}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:workflowdb-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # The test profile's @SpringBootTest context has no real broker to
    # talk to. Spring AMQP's connection factory itself only connects lazily
    # on first use, but a @RabbitListener container's SmartLifecycle starts
    # (and tries to connect) at context startup regardless - this turns
    # that off so tests don't spend their startup retrying a connection
    # that was never going to succeed. Messaging behavior itself
    # (TaskCompletedEventPublisher, TaskCompletedMessageListener,
    # DeadLetterReplayService) is therefore exercised only by code review
    # against the documented RabbitMQ/Spring AMQP contract, not by a live
    # integration test - see docs/reliability-report.md.
    listener:
      simple:
        auto-startup: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  external-api:
    # Fixture only - nothing in the test suite actually calls out to this;
    # ExternalNotificationClient's behavior under success/timeout/circuit-
    # open is documented, not live-tested, for the same reason as above.
    base-url: http://localhost:9090
  batch:
    chunk-size: 50
  security:
    # Fixed, obviously-fake fixture values used only by the automated test
    # suite against a throwaway in-memory database - this document is last
    # in the file specifically so it overrides the shared block's required,
    # no-default placeholders above when the "test" profile is active (see
    # docs/concurrency-design.md's note on multi-document YAML precedence,
    # the same pattern this file already follows for the datasource).
    jwt-secret: "test-only-signing-key-not-used-anywhere-else-0123456789"
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    admin-bootstrap-username: test-admin
    admin-bootstrap-email: test-admin@example.com
    admin-bootstrap-password: test-admin-pass-1
  cors:
    allowed-origins: http://localhost:3000
