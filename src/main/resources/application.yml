spring:
  application:
    name: workflow-management-api
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:workflowdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

---
server:
  port: ${SERVER_PORT:8080}

app:
  security:
    # No default - a missing JWT_SECRET fails startup instead of signing
    # tokens with a weak, guessable key. Must be at least 32 bytes
    # (256 bits) for HS256; JwtService enforces this at startup.
    jwt-secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
    # The one ADMIN account created automatically on first startup (see
    # AdminBootstrapSeeder) - also required, also no default, for the same
    # reason: no credential of any kind is committed to this repository.
    admin-bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME}
    admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL}
    admin-bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.relic.backend: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:workflowdb-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  security:
    # Fixed, obviously-fake fixture values used only by the automated test
    # suite against a throwaway in-memory database - this document is last
    # in the file specifically so it overrides the shared block's required,
    # no-default placeholders above when the "test" profile is active (see
    # docs/concurrency-design.md's note on multi-document YAML precedence,
    # the same pattern this file already follows for the datasource).
    jwt-secret: "test-only-signing-key-not-used-anywhere-else-0123456789"
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    admin-bootstrap-username: test-admin
    admin-bootstrap-email: test-admin@example.com
    admin-bootstrap-password: test-admin-pass-1
  cors:
    allowed-origins: http://localhost:3000
